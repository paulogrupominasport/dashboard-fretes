name: Atualizar dados CTEs

on:
  schedule:
    # minutos "fora de pico" (o GitHub atrasa/pula execuções perto de :00 e :30)
    - cron: "7,37 * * * *"
  workflow_dispatch:            # botão "Run workflow" / disparo via API (Apps Script)
  push:
    branches: [ main ]
    paths:
      - "build_data.py"
      - ".github/workflows/update-ctes.yml"

permissions:
  contents: write

concurrency:
  group: update-ctes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (leitura autenticada da planilha)
        run: pip install --quiet google-api-python-client google-auth

      - name: Gerar dados_ctes.json
        env:
          # cole a chave JSON da conta de serviço em Settings > Secrets and variables
          # > Actions > New repository secret, com o nome GOOGLE_SA_JSON.
          # Se este secret estiver vazio, o script cai no modo público (gviz).
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python build_data.py

      - name: Commitar se houver mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dados_ctes.json)" ]; then
            git add dados_ctes.json
            git commit -m "chore: atualiza dados CTEs ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
            git push
          else
            echo "Sem mudanças nos dados."
          fi
